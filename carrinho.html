<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra | Loja do Ferb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LOJA DO FERB</h1>
    </header>

    <main class="carrinho">
        <h2>Finalizar compra</h2>
        <p class="carrinho-intro">Confira seu pedido e preencha os dados para concluir a compra.</p>

        <section class="resumo-carrinho">
            <h3>Seu carrinho</h3>
            <div class="item-carrinho" data-produto="slackline" hidden>
                <img src="img/slack_line.jpg" alt="Kit Slackline Completo Pro 15m">
                <div>
                    <h4>Kit Slackline Completo Pro 15m</h4>
                    <p class="preco-produto">R$ 148,50</p>
                    <label for="quantidade-slackline">Quantidade</label>
                    <input id="quantidade-slackline" type="number" min="0" value="1">
                </div>
            </div>
            <div class="item-carrinho" data-produto="projetor" hidden>
                <img src="img/projetor.jpg" alt="Projetor Inteligente Full HD WiMiUS P62">
                <div>
                    <h4>Projetor Inteligente Full HD WiMiUS P62</h4>
                    <p class="preco-produto">R$ 700,00</p>
                    <label for="quantidade-projetor">Quantidade</label>
                    <input id="quantidade-projetor" type="number" min="0" value="1">
                </div>
            </div>
        </section>

        <form class="formulario-compra">
            <fieldset>
                <legend>Dados para entrega</legend>
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required>

                <label for="endereco">Endereço</label>
                <input id="endereco" name="endereco" type="text" required>

                <div class="campos-linha">
                    <div>
                        <label for="cidade">Cidade</label>
                        <input id="cidade" name="cidade" type="text" required>
                    </div>
                    <div>
                        <label for="cep">CEP</label>
                        <input id="cep" name="cep" type="text" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Pagamento</legend>
                <label for="pagamento">Forma de pagamento</label>
                <select id="pagamento" name="pagamento">
                    <option value="pix">Pix</option>
                    <option value="cartao">Cartão de crédito</option>
                    <option value="boleto">Boleto bancário</option>
                </select>
            </fieldset>

            <div class="total-carrinho">
                <span>Total do pedido</span>
                <strong id="valor-total">R$ 848,50</strong>
            </div>
            <button type="submit">Finalizar compra</button>
        </form>
    </main>
    <script>
        const produtoSelecionado = new URLSearchParams(window.location.search).get('produto');
        const itensCarrinho = document.querySelectorAll('.item-carrinho');
        const valorTotal = document.querySelector('#valor-total');

        itensCarrinho.forEach((item) => {
            item.hidden = produtoSelecionado ? item.dataset.produto !== produtoSelecionado : false;
        });

        function atualizarTotal() {
            let total = 0;

            itensCarrinho.forEach((item) => {
                if (!item.hidden) {
                    const quantidade = Number(item.querySelector('input').value) || 0;
                    total += Number(item.dataset.produto === 'slackline' ? 148.5 : 700) * quantidade;
                }
            });

            valorTotal.textContent = total.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        document.querySelectorAll('.item-carrinho input').forEach((input) => {
            input.addEventListener('input', atualizarTotal);
        });

        atualizarTotal();
    </script>
</body>
</html>
